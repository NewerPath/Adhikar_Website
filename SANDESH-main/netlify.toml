# ==============================================================================
# 🏛️ ADHIKAR — NETLIFY DEPLOYMENT CONFIGURATION
# ==============================================================================
# Full support for Next.js 14 (App Router, Server Components & API routes)
# Documentation: https://docs.netlify.com/integrations/frameworks/next-js/
# ==============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Official Netlify Next.js runtime plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache control for immutable static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
